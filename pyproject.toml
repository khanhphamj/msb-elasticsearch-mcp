[project]
name = "sre-es"
version = "0.1.0"
description = "sre-es — MCP server (streamable HTTP) for AgentBase MCP Gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "httpx>=0.27.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
